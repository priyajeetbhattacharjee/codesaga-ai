<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Student Login | CodeSaga AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: linear-gradient(
                135deg,
                #f3f8ff 0%,
                #eef2ff 50%,
                #fff7e6 100%
            );
            min-height: 100vh;
        }

        .login-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            border: 0;
            border-radius: 20px;
        }

        .login-icon {
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            background: #e7f1ff;
            border-radius: 50%;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <nav class="navbar bg-primary shadow-sm">
        <div class="container">

            <a
                class="navbar-brand text-white fw-bold"
                href="{{ url_for('home') }}"
            >
                CodeSaga AI
            </a>

            <span class="navbar-text text-white">
                Student Portal
            </span>

        </div>
    </nav>

    <main class="container login-section">

        <div class="row justify-content-center w-100">

            <div class="col-md-7 col-lg-5 col-xl-4">

                <div class="card login-card shadow-lg">
                    <div class="card-body p-4 p-md-5">

                        <div class="login-icon mb-3">
                            🎓
                        </div>

                        <h1 class="h2 text-center fw-bold">
                            Welcome Back
                        </h1>

                        <p class="text-secondary text-center mb-4">
                            Log in to continue your coding adventure.
                        </p>

                        {% if error %}

                            <div class="alert alert-danger">
                                {{ error }}
                            </div>

                        {% endif %}

                        <form
                            method="POST"
                            action="{{ url_for('login') }}"
                        >

                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label fw-semibold"
                                >
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    class="form-control form-control-lg"
                                    placeholder="student@example.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                            <div class="mb-4">

                                <label
                                    for="password"
                                    class="form-label fw-semibold"
                                >
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    class="form-control form-control-lg"
                                    placeholder="Enter your password"
                                    autocomplete="current-password"
                                    required
                                >

                            </div>

                            <button
                                type="submit"
                                class="btn btn-primary btn-lg w-100"
                            >
                                Enter CodeSaga
                            </button>

                        </form>

                        <p class="text-center mt-4 mb-0">
                            <a
                                href="{{ url_for('home') }}"
                                class="text-decoration-none"
                            >
                                ← Return to homepage
                            </a>
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
